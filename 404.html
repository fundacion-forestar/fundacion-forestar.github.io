<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — Fundación Forestar</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; font-family: 'Lato', sans-serif; color: #1a2e1a; background: linear-gradient(160deg, #F1F8E9 0%, #E8F5E9 60%, #C8E6C9 100%); }
        .box { max-width: 560px; text-align: center; }
        .code { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(64px, 18vw, 120px); line-height: 1; color: #1B5E20; }
        h1 { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 22px; margin: 16px 0 8px; }
        p { color: #4a5e4a; line-height: 1.6; margin-bottom: 4px; }
        .en { font-size: 14px; color: #6b7d6b; margin-top: 12px; }
        .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
        .links a { text-decoration: none; padding: 11px 20px; border-radius: 30px; font-weight: 700; font-size: 15px; }
        .main { background: #1B5E20; color: #fff; }
        .main:hover { background: #2E7D32; }
        .sec { background: #fff; color: #1B5E20; border: 2px solid #1B5E20; }
        .sec:hover { background: #F1F8E9; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Esta página no existe</h1>
        <p>Puede que el enlace esté mal escrito o que la página haya cambiado de lugar.</p>
        <p class="en">This page does not exist. The link may be mistyped or the page may have moved.</p>
        <div class="links">
            <a class="main" href="/">Ir al inicio · Home</a>
            <a class="sec" href="/#carbono">Bonos de carbono</a>
            <a class="sec" href="/#contacto">Contacto</a>
        </div>
    </div>
</body>
</html>
